<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>论证镜 · 工作台</title>
<style>
:root,[data-theme="dark"]{
 --bg:#0E1216;--panel:#141A21;--panel2:#1A222B;--panel3:#202A35;--line:#28323D;--line2:#384553;--edge:#5C6E80;
 --text:#D6DEE7;--text2:#9EABB8;--muted:#8897A5;--accent:#6BA7E8;--accentbg:#15283C;
 --warn:#E0A94A;--warnbg:#2E2617;--ok:#63B08A;--okbg:#182A22;--danger:#D98080;--sel:#1B2F42;
 --mono:ui-monospace,"Cascadia Code","SFMono-Regular",Consolas,"Liberation Mono",monospace;
 --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
[data-theme="light"]{
 --bg:#ECEFF3;--panel:#FFFFFF;--panel2:#F4F6F8;--panel3:#EAEEF2;--line:#D8DEE5;--line2:#C4CDD7;--edge:#8FA0B0;
 --text:#1C2733;--text2:#4A5764;--muted:#5E6A76;--accent:#1A63AC;--accentbg:#E4F0FC;
 --warn:#8A5600;--warnbg:#FBF0DC;--ok:#2E7355;--okbg:#E6F2EB;--danger:#A84242;--sel:#DCEBFA;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:12px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.mono{font-family:var(--mono)}
/* 工具栏那行是 auto 而不是 34px：1280 宽时它自然就是 34px（与原来一致），
   1100 宽时多出来的按钮换到第二行、整行自己长高，而不是把「这份报告」压成竖排、
   把快捷键提示挤到可视区外——挤掉的那两处不会报错，只有看图才发现。 */
.app{display:grid;grid-template-rows:28px auto auto minmax(0,1fr) 24px;height:100vh}
.body{display:grid;grid-template-columns:236px minmax(0,1fr) 296px;min-height:0;border-top:1px solid var(--line)}
.center{display:grid;grid-template-rows:minmax(0,1fr) 190px;min-height:0;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.pane{background:var(--panel);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ph{height:24px;flex:0 0 24px;display:flex;align-items:center;gap:8px;padding:0 9px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.ph b{font-weight:600;color:var(--text2);letter-spacing:.08em}
.ph .sp{flex:1}
.ph button{color:var(--muted);font-size:11px;padding:1px 4px;border-radius:3px}
.ph button:hover{background:var(--panel3);color:var(--text)}
.scroll{overflow:auto;min-height:0;flex:1}
.scroll::-webkit-scrollbar{width:9px;height:9px}
.scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
.scroll::-webkit-scrollbar-track{background:transparent}

.topbar{display:flex;align-items:center;gap:16px;padding:0 10px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:11px}
.topbar .logo{font-weight:600;letter-spacing:.1em;color:var(--text)}
.topbar .logo span{font-weight:400;color:var(--muted);letter-spacing:.04em;margin-left:7px;font-family:var(--mono);font-size:10px}
.menu{color:var(--text2)}
.menu span{margin-right:13px}
.topbar .sp{flex:1}
.tlink{color:var(--muted);font-family:var(--mono);font-size:10px}
.tlink:hover{color:var(--accent)}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:4px 5px;padding:4px 9px;background:var(--panel);border-bottom:1px solid var(--line)}
.toolbar .lbl{color:var(--muted);font-size:10px;white-space:nowrap}
.tb{border:1px solid var(--line);background:var(--panel2);border-radius:3px;padding:4px 9px;font-size:11px;color:var(--text2);white-space:nowrap}
.tb:hover{border-color:var(--line2);background:var(--panel3);color:var(--text)}
.tb.pri{border-color:var(--accent);color:var(--accent);background:var(--accentbg)}
.sep{width:1px;height:18px;background:var(--line);margin:0 5px}
.toolbar select{border:1px solid var(--line);background:var(--panel2);border-radius:3px;padding:4px 7px;font-size:11px;color:var(--text2)}
.toolbar .sp{flex:1}
.kbd{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:2px 6px}

.tabs{display:flex;align-items:stretch;flex:0 0 30px;background:var(--panel2);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:0 14px;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap;border-bottom:2px solid transparent}
.tab:hover{color:var(--text2);background:var(--panel3)}
.tab.on{color:var(--text);background:var(--panel);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--panel3);border-radius:3px;padding:0 4px}

/* 每行拉一条横线，十几行下来就是一片网。Refactoring UI 那条说的是：
   优先用底色、阴影、留白区分元素，边框越少界面越不碎。改成隔行底色，
   选区与悬停照样分得清；段落之间仍由 .sec 的那条线分开。 */
.row{display:flex;align-items:center;min-height:22px;font-size:11px}
.row:nth-child(even){background:var(--panel2)}
.row:hover{background:var(--panel3)}
.row.sel{background:var(--sel)}
.k{width:150px;flex:0 0 150px;padding:4px 9px;color:var(--muted);font-family:var(--mono);font-size:10px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{padding:4px 10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
/* 语境区：值下面还要放「凭什么」与「换成别的样子会怎样」，所以这一格不省略、允许多行 */
.ctxrow{align-items:flex-start}
.ctxrow .k{width:168px;flex:0 0 168px;white-space:normal;padding-top:6px}
.ctxrow .v{white-space:normal;overflow:visible;text-overflow:clip;display:flex;flex-direction:column;gap:2px;padding:5px 10px}
.ctxv{color:var(--text);font-size:11px}
.ctxb{color:var(--muted);font-size:10px;line-height:1.55}
.ctxif{color:var(--warn);font-size:10px;line-height:1.55}
.ctxdown{color:var(--danger);font-size:10px;line-height:1.55}
.ctxnote{padding:7px 10px;font-size:10px;line-height:1.75;color:var(--text2);background:var(--panel2);border-bottom:1px solid var(--line)}
.ctxnote.old{color:var(--warn);background:var(--warnbg)}
.gsrc{display:inline-block;font-size:10px;padding:0 4px;margin-right:4px;border-radius:3px;border:1px solid var(--line2);color:var(--muted);vertical-align:1px}
.gsrc.ok{color:var(--ok);border-color:var(--ok)}
.gsrc.warn{color:var(--warn);border-color:var(--warn)}
.gsrc.danger{color:var(--danger);border-color:var(--danger)}
.v.strong{color:var(--text)}
.sec{border-bottom:1px solid var(--line2)}
.sech{display:flex;align-items:center;gap:8px;height:25px;padding:0 9px;background:var(--panel2);cursor:pointer;font-size:11px;position:sticky;top:0;z-index:2}
.sech:hover{background:var(--panel3)}
.sech .arw{font-family:var(--mono);color:var(--muted);width:9px}
.sech .nm{font-weight:600;color:var(--text);letter-spacing:.03em}
.sech .cnt{font-family:var(--mono);font-size:10px;color:var(--muted)}
.sech .path{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
.sech.flash{background:var(--accentbg)}
table.t{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.06em;background:var(--panel2);padding:5px 8px;border-bottom:1px solid var(--line);position:sticky;top:25px;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.t td{padding:5px 8px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.t tbody tr:nth-child(even) td{background:var(--panel2)}
table.t tr:hover td{background:var(--panel3)}
table.t tr.sel td{background:var(--sel)}
.badge{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid var(--line2);color:var(--muted)}
.badge.unanswered{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}
.badge.passed{color:var(--ok);border-color:var(--ok);background:var(--okbg)}
.badge.violated{color:var(--danger);border-color:var(--danger)}
/* 档位原来是「绿点=好、橙点=弱」，其余一律绿——`refuted`（不成）与
   `undetermined`（未定）都落进了绿点，颜色在替报告说一句它没说过的话。
   而且只靠颜色，色弱的人分不出。现在形状也带信息：
   实心圆=站得住 · 空心圈=被削弱 · 实心方=不成 · 空心方=未定。 */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle;flex:none}
.dot.ok{background:var(--ok)}
.dot.warn{background:transparent;border:1.5px solid var(--warn)}
.dot.danger{background:var(--danger);border-radius:1px}
.dot.und{background:transparent;border:1.5px solid var(--muted);border-radius:1px}
.dot.acc{background:var(--accent)}

.treegrp{border-bottom:1px solid var(--line2)}
.tgh{display:flex;align-items:center;gap:7px;padding:5px 9px;background:var(--panel2);font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgh .sp{flex:1}
/* 分组标题右边那串 id·透镜/模式 会被栏宽裁掉（「WALTON/DIAGNOS」少一个 E），
   裁的时候给省略号，别让人以为名字就长这样。 */
.tgh .mono{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ti{display:flex;align-items:center;gap:7px;padding:3px 9px 3px 18px;font-size:11px;color:var(--text2);min-height:21px;cursor:pointer;border-left:2px solid transparent}
.ti:hover{background:var(--panel3)}
.ti.on{background:var(--sel);border-left-color:var(--accent);color:var(--text)}
.ti .id{font-family:var(--mono);font-size:10px;color:var(--muted)}
.ti .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .ct{font-family:var(--mono);font-size:10px;color:var(--muted)}
.ti .sub{padding-left:8px}
.tifoot{padding:8px 10px;font-size:10px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line)}
/* 形状的含义必须写出来一次，否则空心圈只是一颗不好看的圈。 */
.leg{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:5px}
.leg span{display:flex;align-items:center;gap:3px}
.leg .dot{margin-right:0}
/* 存档行：先摆能认出来的字，再摆 id。
   原来一行只有 8 位 id + 模式 + 字数，而摘录只写在 title 里——104 份报告要逐条悬停
   才知道是哪一份。回看台最常做的一件事就是「找那份」，所以摘录必须是可见文字，
   id 退到第二行做取证用。两行一起高 34px，比原来多 13px，换来的是一眼能扫。 */
.ti.arc{align-items:flex-start;padding:5px 9px 5px 12px;min-height:34px;gap:6px}
.ti.arc .dot{flex:none;margin-right:0;margin-top:5px}
.ti.arc .arcmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ti.arc .arcx{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti.arc .arcmeta{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti.arc.arcnow .arcx{color:var(--text)}

.inspkv{display:grid;grid-template-columns:104px minmax(0,1fr);border-bottom:1px solid var(--line);font-size:11px}
.inspkv .ik{padding:5px 8px;font-family:var(--mono);font-size:10px;color:var(--muted);border-right:1px solid var(--line);word-break:break-all}
.inspkv .iv{padding:5px 8px;color:var(--text2);word-break:break-word;white-space:pre-wrap;line-height:1.6}
.inspsec{padding:6px 9px;background:var(--panel2);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--line)}
pre.json{margin:0;padding:9px;font-family:var(--mono);font-size:10px;color:var(--text2);white-space:pre-wrap;word-break:break-all;line-height:1.55;background:var(--bg)}
/* 检查器人话层：中文名、术语解释、枚举翻译都写在明确标注的阅读层里，
   原始字段名和原始 JSON 都留着，方便逐字取证。 */
.in-about{padding:8px 10px;font-size:11px;line-height:1.7;color:var(--text2);background:var(--panel);border-bottom:1px solid var(--line)}
.in-caveat{padding:7px 10px;font-size:10px;line-height:1.65;color:var(--muted);background:var(--accentbg);border-bottom:1px solid var(--line)}
.inspkv{grid-template-columns:120px minmax(0,1fr)}
.izh{display:block;color:var(--text);font-size:11px;font-weight:600;margin-bottom:2px;line-height:1.4}
.ien{display:block;color:var(--muted);font-size:10px;word-break:break-all;font-family:var(--mono)}
.ik .iq{display:inline-block;margin-top:3px;padding:0 4px;border:1px solid var(--line2);border-radius:6px;color:var(--muted);font-size:10px;line-height:13px}
.iv-zh{display:inline-block;margin-left:7px;padding:1px 5px;border-radius:3px;background:var(--accentbg);color:var(--accent);font-size:10px;cursor:help;white-space:nowrap}
.inog{display:block;margin-top:3px;color:var(--muted);font-size:10px}
.in-act{display:flex;gap:6px;flex-wrap:wrap;padding:9px 10px;border-top:1px solid var(--line);background:var(--panel2)}
.in-json{border-top:1px solid var(--line)}
.in-json summary{padding:7px 10px;font-size:10px;color:var(--muted);cursor:pointer;background:var(--panel2)}
.in-json[open] summary{border-bottom:1px solid var(--line)}
.empty{padding:18px 12px;color:var(--muted);font-size:11px;line-height:1.8}

.btabs{display:flex;align-items:center;background:var(--panel2);border-bottom:1px solid var(--line);height:25px;flex:0 0 25px}
.btab{padding:0 11px;font-size:10px;color:var(--muted);height:25px;display:flex;align-items:center;border-right:1px solid var(--line);letter-spacing:.04em}
.btab.on{color:var(--text);background:var(--panel);border-bottom:2px solid var(--accent)}
.btab:hover{color:var(--text2)}
.btabs .sp{flex:1}
.collapsed{height:25px!important;flex:0 0 25px!important}
.collapsed .scroll,.collapsed .btabs{display:none}

.qrow{display:flex;align-items:flex-start;gap:9px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:11px}
.qrow:hover{background:var(--panel3)}
.qrow .qi{font-family:var(--mono);font-size:10px;color:var(--accent);min-width:34px}
.qrow .qt{flex:1;color:var(--text2);line-height:1.6}
.qrow .qw{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.qbar{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}
.qbar .track{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.qbar .fill{height:100%;background:var(--warn);width:0}
.qact{display:flex;gap:6px;padding:8px 10px;align-items:center;border-top:1px solid var(--line)}
.qact input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:5px 8px;font-size:11px;outline:none;min-width:0}
.qact input:focus{border-color:var(--accent)}
/* ─────────── 异议锚点 ───────────
 * 一条异议原来只是底部一行字，看不出它反对的是哪一处。这里把「钉在哪」
 * 做成单独一条，且让原文每一句都能当锚点。颜色沿用 accent（分歧不是错误，
 * 不用红）；徽标是按钮，点它能回到那一处。 */
.anbar{display:flex;align-items:center;gap:7px;padding:6px 10px;background:var(--panel2);border-top:1px solid var(--line);font-size:10px;flex-wrap:wrap}
.anbar .anlbl{color:var(--muted);white-space:nowrap}
.anbar .anval{font-family:var(--mono);font-size:10px;color:var(--accent);background:var(--accentbg);border:1px solid var(--line2);border-radius:3px;padding:2px 6px;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anbar .anquote{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34%;font-size:10px}
.anbar .sp{flex:1}
.anbar .hint{color:var(--muted);font-size:10px;line-height:1.6;flex-basis:100%}
.anbadge{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--accent);background:var(--accentbg);border:1px solid var(--line2);border-radius:3px;padding:1px 5px;margin-right:6px;line-height:1.7}
.anbadge:hover{border-color:var(--accent)}
.anbadge.none{color:var(--muted);background:transparent;border-style:dashed}
.anq{color:var(--muted);font-size:10px;display:block;margin:2px 0;line-height:1.6}
.anpick{border:1px solid var(--line2);background:transparent;color:var(--accent);font-size:10px;border-radius:3px;padding:1px 5px;cursor:pointer;font-family:var(--mono)}
.anpick:hover{background:var(--accentbg)}
.codeln.anchored{background:var(--accentbg)}
.codeln.flash{background:var(--warnbg)}
.codeln .an{display:flex;align-items:center;gap:7px}
.anmark{color:var(--accent);font-size:10px}
.anstat{display:flex;gap:12px;padding:7px 10px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:10px;color:var(--muted);flex-wrap:wrap}
.anstat b{color:var(--text);font-family:var(--mono)}
.anrow{display:flex;gap:9px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:11px;cursor:pointer;align-items:flex-start}
.anrow:hover{background:var(--panel3)}
.anrow .andoc{font-family:var(--mono);font-size:10px;color:var(--muted);min-width:76px;padding-top:2px}
.anrow .anbody{flex:1;color:var(--text2);line-height:1.6;min-width:0}
.anrow .anmeta{color:var(--muted);font-family:var(--mono);font-size:10px;white-space:nowrap;padding-top:2px}
.anrow .cur{color:var(--accent)}
.anempty{padding:16px 12px;color:var(--muted);font-size:11px;line-height:1.9}
.logline{padding:3px 10px;font-family:var(--mono);font-size:10px;color:var(--text2);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logline .ts{color:var(--muted);margin-right:9px}

/* 状态栏原来整条铺 accentbg，屏幕上最大的一块颜色被最不重要的一行占着。
   改成与其他面板同底色，颜色只留在「● 就绪」那一个字上。 */
.status{display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--panel2);border-top:1px solid var(--line2);font-family:var(--mono);font-size:10px;color:var(--text2)}
.status .sp{flex:1}
.status .hi{color:var(--accent)}
.status .st-warn{flex:0 0 auto;border:1px solid var(--warn);border-radius:3px;background:transparent;color:var(--warn);font:inherit;cursor:pointer;padding:1px 6px}
.status .st-warn:hover{background:var(--warn);color:var(--bg)}

.gridbg{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20px 20px;opacity:.5}
.graphwrap{position:relative;padding:16px;min-height:100%}
.graphwrap .abs{position:relative;z-index:1}
.gnode{fill:var(--panel2);stroke:var(--line2);stroke-width:1;cursor:pointer}
.gnode:hover{fill:var(--sel);stroke:var(--accent)}
.gnode.hit{fill:var(--warnbg);stroke:var(--warn)}
.gtext{fill:var(--text);font-size:11px;font-family:var(--sans)}
.gsmall{fill:var(--muted);font-size:10px;font-family:var(--mono)}
.gedge{stroke:var(--edge);stroke-width:1.4;fill:none}
.gedge.cut{stroke:var(--warn);stroke-dasharray:4 3}
.glabel{fill:var(--warn);font-size:10px;font-family:var(--mono)}

.cmp{width:100%;border-collapse:collapse;font-size:11px}
.cmp th{background:var(--panel2);color:var(--muted);font-family:var(--mono);font-size:10px;text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);position:sticky;top:0}
.cmp td{padding:6px 9px;border-bottom:1px solid var(--line);color:var(--text2);vertical-align:top;line-height:1.6;width:33%}
.cmp td:first-child{font-family:var(--mono);font-size:10px;color:var(--muted);width:22%}
.cmp td.diff{background:var(--warnbg);color:var(--text)}
.cmphead{display:flex;gap:14px;padding:9px 10px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:10px;color:var(--muted);font-family:var(--mono)}

.code{font-family:var(--mono);font-size:12px;line-height:2.1;padding:12px 0}
.codeln{display:flex;border-bottom:1px solid var(--line);min-height:26px}
.codeln:hover{background:var(--panel3)}
.codeln .ln{width:44px;flex:0 0 44px;text-align:right;padding:3px 10px 3px 0;color:var(--muted);border-right:1px solid var(--line);font-size:10px;user-select:none}
.codeln .ct{padding:3px 12px;color:var(--text2);white-space:pre-wrap;flex:1}
.codeln .an{font-family:var(--mono);font-size:10px;color:var(--accent);padding:3px 10px;white-space:nowrap}
.codeln mark{background:var(--accentbg);color:var(--accent);border-bottom:1px solid var(--accent)}

.cmdwrap{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.cmd{width:520px;max-width:92vw;background:var(--panel);border:1px solid var(--line2);border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.45);overflow:hidden}
.cmd input{width:100%;padding:12px 14px;background:var(--panel2);border:0;border-bottom:1px solid var(--line);outline:none;font-size:12px;color:var(--text)}
.cmdlist{max-height:300px;overflow:auto}
.cmdi{padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2);border-bottom:1px solid var(--line);cursor:pointer}
.cmdi:hover,.cmdi.on{background:var(--sel);color:var(--text)}
.cmdi .t{flex:1}
.cmdi .p{font-family:var(--mono);font-size:10px;color:var(--muted)}
.cmdf{padding:6px 14px;font-size:10px;color:var(--muted);font-family:var(--mono)}
.toast{position:fixed;right:16px;bottom:36px;z-index:70;background:var(--panel3);border:1px solid var(--line2);border-radius:6px;padding:8px 13px;font-size:11px;color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,.3)}
/* 加了底色的只有这一个，它和速览页那个「回去分析文本」是同一件事。
   同一屏两个实心按钮在争注意力，所以这里退成线框：这是离开的动作，不是主任务。 */
.tlink.btn{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:3px;padding:3px 10px;font-family:var(--sans);font-size:11px;font-weight:600;white-space:nowrap}
.tlink.btn:hover{background:var(--accentbg)}
.guide{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--accentbg);border-bottom:1px solid var(--line);font-size:11px;color:var(--text2);line-height:1.65}
/* 说明条原来是一整段 230 字、一行铺到 1080px——按每行 45—75 字算，那是三倍长。
   现在断成两行，每行 40—50 字，读完不用来回摆头。 */
.guide>b{flex:none}
.guide>span{max-width:860px}
.guide b{color:var(--text);font-weight:600}
.guide .sp{flex:1}
.guide button{border:1px solid var(--line2);border-radius:3px;padding:2px 9px;font-size:10px;color:var(--text2);white-space:nowrap}
.guide button:hover{background:var(--panel3);color:var(--text)}
.ov{padding:24px 30px 38px;max-width:880px}
.ov .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--muted);margin-bottom:15px}
.ov h1{font-size:22px;line-height:1.5;font-weight:600;color:var(--text);margin:0 0 10px;max-width:820px}
.ov .issue{font-size:12px;color:var(--text2);margin-bottom:24px;padding-left:11px;border-left:2px solid var(--line2)}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px;margin-bottom:22px}
.ovcard{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-height:118px}
.ovcard .h{font-size:10px;letter-spacing:.1em;color:var(--muted);margin-bottom:10px}
.ovcard .p{font-size:12px;line-height:1.75;color:var(--text2);margin:0 0 8px}
.ovcard .p:last-child{margin-bottom:0}
.ovcard .q{font-family:var(--mono);font-size:10px;color:var(--accent);display:block;margin-bottom:3px}
.ovquote{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:3px;padding:10px 14px;font-size:12px;line-height:1.8;color:var(--text2);margin-bottom:20px;cursor:pointer}
.ovquote:hover{background:var(--panel3)}
.ovquote .lb{font-family:var(--mono);font-size:10px;color:var(--muted);display:block;margin-bottom:5px}
.ovact{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.ovbtn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:3px;padding:9px 15px;font-size:12px}
.ovbtn:hover{background:var(--panel3);border-color:var(--accent)}
.ovbtn.primary{background:var(--accentbg);border-color:var(--accent);color:var(--accent);font-weight:600}
.ovbtn.primary:hover{background:var(--sel)}
.ovfoot{font-size:10px;color:var(--muted);line-height:1.8;max-width:760px}
/* 只读值、左树过滤、命令类别：把「看着能改其实改不了」的控件换成只读 + 真动作。 */
.ro{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--panel2);border-radius:3px;padding:4px 8px;font-family:var(--mono);font-size:10px;color:var(--text2);white-space:nowrap}
.arcfilter{width:100%;box-sizing:border-box;background:var(--bg);border:0;border-bottom:1px solid var(--line);padding:6px 9px;font-size:11px;color:var(--text2);outline:none}
.arcfilter:focus{border-bottom-color:var(--accent)}
.arcfilter::placeholder{color:var(--muted)}
.cmdi .kind{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 5px;white-space:nowrap}
.ti.arcnow{background:var(--sel);border-left-color:var(--accent);color:var(--text)}
/* 跨报告全文检索：搜的是本机已存档报告里的字，不调模型、不写盘。 */
.sr{padding:18px 22px 34px;max-width:880px}
.sr-h{font-size:11px;color:var(--text2);line-height:1.7;margin-bottom:12px}
.sr-h b{color:var(--text)}
.sr-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.sr-input{flex:1;min-width:240px;background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:8px 11px;color:var(--text);font-size:12px;outline:none;font-family:var(--sans)}
.sr-input:focus{border-color:var(--accent)}
.sr-input::placeholder{color:var(--muted)}
.sr-btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:3px;padding:8px 13px;font-size:11px;white-space:nowrap}
.sr-btn:hover{background:var(--panel3)}
.sr-btn.pri{background:var(--accentbg);border-color:var(--accent);color:var(--accent);font-weight:600}
.sr-sel{background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:7px 8px;color:var(--text2);font-size:11px;outline:none}
.sr-meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);padding:7px 0 9px;margin-bottom:4px}
.sr-meta b{color:var(--text);font-family:var(--mono)}
.sr-meta .cap{color:var(--warn)}
.sr-row{display:grid;grid-template-columns:104px minmax(0,1fr) 78px;gap:10px;align-items:start;padding:9px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:3px}
.sr-row:hover{background:var(--panel2)}
.sr-stale{opacity:.45}
.sr-id{font-family:var(--mono);font-size:10px;color:var(--accent);line-height:1.7}
.sr-id .sm{display:block;color:var(--muted);font-size:10px}
.sr-body{min-width:0}
.sr-path{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:3px;word-break:break-all}
.sr-clip{font-size:12px;line-height:1.7;color:var(--text2);word-break:break-word}
.sr-clip mark{background:var(--warnbg);color:var(--warn);border-radius:3px;padding:0 1px}
.sr-go{font-size:10px;color:var(--muted);text-align:right;white-space:nowrap;line-height:1.7}
.sr-row:hover .sr-go{color:var(--accent)}
.sr-empty{padding:26px 8px;color:var(--muted);font-size:11px;line-height:1.8}
/* 空状态：一个符号、一句这是什么、一句为什么、一到两个真能点的动作。 */
.estate{padding:28px 14px;max-width:520px}
.estate .eic{font-size:22px;line-height:1;color:var(--line2);margin-bottom:10px}
.estate .ett{font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px}
.estate .ehh{font-size:11px;line-height:1.75;color:var(--text2);margin-bottom:13px}
.estate .eacts{display:flex;gap:8px;flex-wrap:wrap}
.echip{border:1px solid var(--line2);background:var(--panel2);color:var(--text2);border-radius:3px;padding:5px 10px;font-size:11px}
.echip:hover{border-color:var(--accent);color:var(--accent)}
.sr-foot{font-size:10px;color:var(--muted);line-height:1.8;margin-top:14px;border-top:1px solid var(--line);padding-top:9px}
.sr-err{color:var(--danger);font-size:11px;padding:8px 0}
@media(max-width:1100px){.body{grid-template-columns:196px minmax(0,1fr) 240px}.k{width:118px;flex-basis:118px}.ov{padding:20px}}

<script id="gloss" type="application/json">{"v":1,"n":39,"terms":{"conclusion":["结论","这段话到底想让你接受哪一句。一段话里通常只有一句。","很多争论吵不起来，是因为双方连「要争的是哪一句」都没对齐。所以先把它单独拎出来。","「这说明取消早读是错的」——这就是结论。"],"premise":["前提","他摆出来当依据的那几句话。","","「去年取消早读，今年一本率降了 6 个点」——这是前提。"],"implicit":["隐含前提","他一个字没说、但你必须先同意，结论才推得出来的一句话。","补出隐含前提是有风险的：补错了，你就在反驳一个对方没说过的主张。所以本工具要求每条隐含前提都写成固定句式，写不出就不许列。","他说「取消早读后成绩降了，所以取消早读是错的」，中间欠一句「成绩下降确实是取消早读造成的」。"],"intermediate":["中间结论","一步推不完时，中途先得出的那句小结论。","",""],"reconstruction":["重构","把口语整理成「因为……所以……」的样子，先摆平了再看。","重构本身就可能出错，而且重构错了，后面所有评价都跟着错。所以它排在评价前面，也接受被质疑。",""],"supports":["支撑关系","哪句依据在撑哪句话。结构图上的连线就是它。","",""],"verdict":["判读","最后那一句话：站得住、被削弱，还是不成。","「被削弱」和「不成」是两件事：被削弱只是说他没论证成功，不等于他说错了。混为一谈是最常见的越界。",""],"acceptability":["可接受性","这条依据，他的听众认不认。","注意它不是「客观上真不真」。一个真有数据支撑的前提，对一群不承认统计学的人依然不可接受——而论证是要说服人的。",""],"relevance":["相关性","这条依据跟结论有没有关系。","","「他儿子考上了清华」跟「他的教学方案好不好」没有关系。"],"sufficiency":["充分性","这些依据加起来，够不够撑住结论。","「够」永远是相对于某个标准说的：同一个证据量，在刑事判决里不够，在民事里可能够。所以判充分性必须先写清是哪一档标准。",""],"burden":["举证责任","谁该拿出证据。","「你证明不了我错，所以我是对的」是错置责任。提出主张的人先举证；只有对方给出反证时，责任才可能翻过去。",""],"defeat":["击败","这份论证在哪一步上没撑住。","",""],"undermining":["削弱性击败","把「依据」和「结论」之间那根线剪断了，但没说结论一定是假的。","","「同期生源也变了」——这不证明取消早读没影响，只证明他的论证不足以说明有影响。"],"rebutting":["反驳性击败","直接给出「结论是假的」的理由。","真正做到这一步很难：要证明结论假，光挑论证的毛病不够。所以界面上大多数结果只能是「削弱」。",""],"scope":["范围门","这把尺子在这段话上根本不适用时，直接说「不量了」。","","拿「讨论是否公平」的十规则去量一条广告，看起来很严密，其实是拿错了尺子。"],"tag":["认识论标签","这个判断的根据是哪一类：有出处、算出来的、推出来的、常识，还是猜的。","",""],"confidence":["置信度","他自己对这个判断有多确定。","「猜的」最高只能标到「低」。这条限制是为了防止流畅的措辞冒充确定。",""],"steelman":["对方最强版本","替对方想出他最能打的那个回击，而不是立个稻草人。","没有这一栏的反驳只是吵架，而且会让你拿着半成品去被人一句话打回。",""],"legit":["此处合法","看起来可疑、其实做得对的地方。","清单式批评最深的毛病：列出的四条里有一条其实是对方做得对，你也不改判，因为清单上没有「合法」这一栏。",""],"meta":["元问题","先问的那个总闸问题。它答「否」，后面一串问题都不用问了。","","「他是不是这个领域的专家」答否，就不用再问「他的说法有没有依据」。"],"epi":["自检量表","这份分析给自己打的七项分，不是给原文打的。","一个只会挑别人毛病的工具，本身就违反了它自己的标准。所以它必须对自己用同一把尺子。",""],"modal":["模态越界","把「很可能」说成「必然」。","","「今年降了 6 个点」→「所以取消早读是错的」，中间这一步把相关当成了唯一原因。"],"catalog":["名录法","查字典式地给论证贴个名字。","机器在细分类上最好也只有三成左右准确率；同一处往往能对上好几个名字。所以这副透镜只给候选，不给判决。",""],"scheme":["型式","大家惯用的推理套路，比如「专家说的」「前后脚发生所以有因果」「都这么干所以没错」。","套路本身没有对错。错的是误用：套路自带的问题没回答，或者这个套路在这里根本不该用。",""],"cq":["批判性问题","每个套路自带的那几个「你凭什么叫我相信」。","","「专家说的」自带的问题：他真是这行的专家吗？他说的和这个结论是同一件事吗？有没有别的专家不同意？"],"family":["族","套路的四大类：靠后果吓你、靠因果解释你、靠谁说的压你、靠比较说服你。","认错族比认错具体型式更常见，也更致命——四条批判性问题会全部问偏。",""],"skeleton":["骨架","把这个套路写成一行字：依据是这些，所以结论是那个。","",""],"warrant":["担保","凭什么这些理由能推出那个主张。","它和「理由」不是一回事：理由是事实，担保是「这种事实通常能推出那种结论」的通行规则。绝大多数论证出错，就错在这根担保没说出口、或者撑不住。","理由：今年降了 6 个点。担保：成绩波动通常由校内政策造成。这根担保站不住，因为生源、师资、命题难度都会影响。"],"grounds":["理由","他摆出来的那些事实。","",""],"backing":["支援","担保本身有没有靠山。","支援缺位在生活里极常见，也常常够用——图尔敏只记录它在不在，不判对错。",""],"qualifier":["限定","他把话说得多满：「必然」「通常」还是「可能」。","",""],"rebuttal":["例外","他自己承认的「除非……」。","",""],"stage":["四阶段","一场讨论的四个段落：吵起来、谈规则、摆理由、收尾。","",""],"dialogue":["对话类型","这是在说服、在谈判、在吵架、还是在查证。","同一句话换个场合，合法性就变了：谈判桌上藏住底价是本事，学术讨论里藏住数据是作弊。",""],"rule":["十规则","让讨论能谈下去的十条基本规矩：不许堵嘴、不许偷换议题、不许把举证推给对方……","规则只管程序公不公平，不管谁对。程序干净而结论错误，是完全可能的。",""],"pta":["型式周期表","把论证按三个特征分格子的分类法，像化学元素表。","",""],"order":["阶","一步推到底（一阶），还是绕了一层（二阶）。","",""],"axis":["轴","在说同一个东西的两面（谓词），还是拿两个东西在比（主词）。","",""],"condition":["成立条件","使它成为「这一条」而不是「别一条」的条件。","写不出这个条件，就不该给名字——这是本工具对「贴标签」收的过路费。",""]}}</script>

/* 报告里的字段路径 → 值。Ctrl/⌘+K 说的「搜字段」靠它兑现，不是只搜命令。 */
let FIELD_INDEX=[];
function getPath(root,p){
 let v=root;
 for(const k of String(p).replace(/\[(\d+)\]/g,'.$1').split('.').filter(Boolean)){
  if(v===null||v===undefined) return undefined; v=v[k];
 }
 return v;
}
function buildFieldIndex(){
 const out=[];
 const walk=(o,path,depth)=>{
  if(depth>5||o===null||o===undefined) return;
  if(Array.isArray(o)){ o.forEach((v,i)=>walk(v,`${path}[${i}]`,depth+1)); return; }
  if(typeof o==='object'){ for(const [k,v] of Object.entries(o)) walk(v,path?`${path}.${k}`:k,depth+1); return; }
  const val=String(o).replace(/\s+/g,' ').trim();
  if(!val) return;
  out.push({path,key:String(path).split('.').pop().replace(/\[\d+\]$/,''),val,sec:String(path).split(/[.\[]/)[0]});
 };
 walk(R,'',0); FIELD_INDEX=out;
}

/* ─────────── 异议锚点 ───────────
 * 一条异议原来只是底部一行字：写了「我不同意」，却看不出反对的是哪一处，
 * 而且所有工作台异议都落到同一个 refId:'workbench' 上，同一份报告里
 * 第二条会静默覆盖第一条。这里把位置补上，并让位置能点回去。
 *
 * 三类来源统一成同一种显示对象：
 *   新锚点（工作台记的，带 anchor）/ 主程序判定异议（field + refId 已经是位置）
 *   / 老工作台裸异议（refId='workbench'，只能老实写「未锚定」，不假装知道）
 * 派生对象只用于界面，不写回文件；写一个字段多一个字段都算改历史。
 */
const ANCHOR_PATH_RE=/^[A-Za-z_$][\w$]*(?:\.\w+|\[\d+\])*$/;
const FIELD_SEC={verdict:'verdict',defeat:'defeat',check:'checks',label:'labels',legitimate:'legitimateMoves',anchor:'verdict'};
const FIELD_NM={verdict:'判读',defeat:'击败',check:'检查项',label:'命名候选',legitimate:'此处合法',anchor:'读者锚点'};
function sentenceText(n){ return sentences()[(Number(n)||0)-1]||''; }
/* 与主进程 anchorRefId 同一套规则：即使锚点被判为无效，refId 里仍留着位置，
   不会退回旧裸异议的 key 把第一条覆盖掉。 */
function refIdOf(a){
 if(!a) return 'workbench';
 if(a.kind==='field') return `field:${a.path||''}`;
 if(a.kind==='sentence') return `sentence:${a.sentence||0}`;
 return 'report:whole';
}
function deriveAnchor(o){
 if(!o) return null;
 if(o.anchor && typeof o.anchor==='object') return o.anchor;
 if(!o.refId || String(o.refId)==='workbench') return null;
 const f=String(o.field||'');
 return {kind:'field',path:FIELD_SEC[f]||'verdict',
  label:'判定 · '+(o.refLabel||o.refId||FIELD_NM[f]||'未命名'),quote:o.excerpt||'',legacy:true};
}
/* 当前检查器里的字段路径。对象则下钻到第一个有字的标量，
   免得锚点变成一整坨 JSON。 */
function readablePath(path){
 const v=getPath(R,path);
 if(v&&typeof v==='object'&&!Array.isArray(v)){
  const k=Object.keys(v).find(k=>typeof v[k]==='string'&&v[k].trim());
  if(k) return path+'.'+k;
 }
 return path;
}
 function selectionPath(){
 const l=String(S.selLabel||'');
 /* 先认「前缀 + 路径」；认不出再取末尾那段路径（检索命中、异议锚点的标签
    是「中文 · 路径」这种写法）。两种都不认就退回判读那一句，不瞎钉。 */
 const m=l.match(/^(?:report\.|字段\s+|检索命中\s+|异议锚点\s+)?([A-Za-z_$][\w$]*(?:\.\w+|\[\d+\])*)$/)
      || l.match(/([A-Za-z_$][\w$]*(?:\.\w+|\[\d+\])*)\s*$/);
 if(m && ANCHOR_PATH_RE.test(m[1]) && getPath(R,m[1])!==undefined) return readablePath(m[1]);
 return 'verdict.statement';
}
function fieldAnchor(path){
 const v=getPath(R,path);

}

 /* 全量索引 + 过滤：原来只给 16 条、点了还只是把元数据塞进右栏，
    一个叫「资源管理器」的面板却打不开任何一份报告。 */
 const arcAll=D.archive||[];
 const q=S.arcQ.trim().toLowerCase();
 const shown=arcAll.filter(a=>!q||`${a.id} ${a.mode} ${a.theory} ${a.level} ${a.excerpt||''}`.toLowerCase().includes(q));
 /* 全量渲染，不截断：104 行 DOM 很轻，截成 60 条会让「资源管理器」只剩一半，
    用户还得先猜出 id 才能搜到剩下那些。滚动 + 过滤已经够了。 */
 const arc=shown.map(a=>{
  const lv=DMAP[a.level]||'und';
  /* 摘录 16 字：236px 栏里一行放得下 14—16 个汉字，再多就只能靠省略号。
     没有摘录的旧档明写「没有原文摘录」，不留一行空白让人以为是渲染坏了。

  const ex=String(a.excerpt||'').replace(/\s+/g,' ').trim();

function kvRows(obj,path){
 return Object.entries(obj||{}).map(([k,v])=>`<div class="row" data-kv="${esc(k)}" data-path="${esc(path)}"><div class="k" title="${esc(k)}">${esc(k)}</div><div class="v ${typeof v==='string'&&v.length>18?'strong':''}" title="${esc(short(v))}">${esc(short(v))}</div></div>`).join('');
}
/*
 * 语境区。它跟别的字段区不一样，所以单开一个渲染：
 *
 * 那九格是整份报告里唯一没有出处的部分。结论和前提都有 quote 与 span 可以逐字回查，
 * 语境一格都没有——而它最上游：听众决定可接受性，对话类型决定批判性问题怎么排。
 * 实测同一段 41 字的文本分析 98 次，听众出现三种写法，报告里一处都没说这是猜的。
 *
 * 所以每一格先标出处（原文／推出／假定），再给内容；标成假定的，另起一行写明
 * 换成别的样子会怎样。加这一层之前的存档没有它，照实说没有，不补一条假的。
 */
const CTX_SRC={
 known:{zh:'原文',cls:'ok',tip:'能从原文里指出这个说法'},
 inferred:{zh:'推出',cls:'warn',tip:'由原文的某些特征推出来的'},
 guess:{zh:'假定',cls:'danger',tip:'原文没写，为把分析做下去而假定'},
};
/* 这两格不标出处：contextGaps 写的就是「不知道什么」，再给它标一个出处会得到
   「这条猜测本身是猜的」这种废话；dialogueTypeBasis 是上一格的「凭什么」，
   它就是那份依据本身，再标一遍只会让人以为有两个独立的判断。 */
const CTX_NO_MARK={contextGaps:'不标出处——这一格写的就是文本里没有什么',dialogueTypeBasis:'这是上一格的「凭什么」，不单独标'};
function contextRows(ctx,path){
 const all=ctx||{}, g=all.grounding||{};
 const keys=Object.keys(all).filter(k=>k!=='grounding');
 const cnt={known:0,inferred:0,guess:0};
 for(const k of keys){ const s=(g[k]||{}).source; if(CTX_SRC[s]) cnt[s]++; }
 const pv=(R.prompt&&R.prompt.version)?String(R.prompt.version):'';
 const any=keys.some(k=>g[k]&&CTX_SRC[g[k].source]);
 const note=any
  ?`<div class="ctxnote">${cnt.known?`<b style="color:var(--ok)">${cnt.known}</b> 格能从原文指出，`:''}${cnt.inferred?`<b style="color:var(--warn)">${cnt.inferred}</b> 格是推的，`:''}${cnt.guess?`<b style="color:var(--danger)">${cnt.guess}</b> 格是假定。`:'七格都能回到原文。'}标成「假定」的那几格，换成别的样子判定就会变——报告原本不作这个区分。</div>`
  :`<div class="ctxnote old">${pv?`这份存档由提示词 v${esc(pv)} 分析，那个版本还没有语境出处这一层。`:'这份存档没有记录提示词版本，也没有语境出处这一层。'}下面每一格都是分析时直接写下的判断，没有一处能回到原文核对；要看出处，需重新分析一次。</div>`;
 const rows=keys.map(k=>{
  const f=FZ[k], gr=g[k]||{}, s=CTX_SRC[gr.source];
  const skip=CTX_NO_MARK[k];
  /* 整份都没有出处时，每行再挂一个灰色「未标」只是八块噪声——上面那条提示
     已经把这件事说过一遍。只有「别的格标了、这一格没标」才值得单独指出来。 */
  const badge=skip||!any
   ?''
   :s
   ?`<span class="gsrc ${s.cls}" title="${esc(gr.basis||s.tip)}">${s.zh}</span>`
   :`<span class="gsrc" title="这一格没有标出处">未标</span>`;
  const basis=gr.basis&&s?`<span class="ctxb">凭什么：${esc(clip(gr.basis,120))}</span>`:'';
  const down=gr.downgraded?`<span class="ctxdown">它自称引自原文，但原文里找不到这句——已按「推出」处理。</span>`:'';
  const ifc=gr.ifChanged?`<span class="ctxif">换成别的样子：${esc(clip(gr.ifChanged,160))}</span>`:'';
  const vi=valInfo(all[k]);
  const shown=vi?vi.zh:short(all[k]);
  return `<div class="row ctxrow" data-kv="${esc(k)}" data-path="${esc(path)}"><div class="k" title="${esc(skip||k)}">${badge}${esc(f?f.zh:k)}</div><div class="v"><span class="ctxv"${vi?` title="${esc(vi.tip)}"`:''}>${esc(shown)}</span>${basis}${down}${ifc}</div></div>`;
 }).join('');
 return note+rows;
}
function tableRows(arr,cols,path){

}

function renderOverview(){

 const card=(h,arr,empty)=>`<div class="ovcard"><div class="h">${esc(h)}</div>${arr.length?arr.map(x=>`<p class="p">${esc(x)}</p>`).join(''):`<p class="p">${esc(empty)}</p>`}</div>`;

  <div class="ovact">

   <button class="ovbtn" data-act="graph">结构图</button>
  </div>
  <div class="ovfoot">这一页只把已存档报告里的字重新排了一遍，没有新增判断。报告里的判断由模型写出，工作台只负责重排与回看；不发起分析、不调模型、不改报告、不花钱。要分析新文本或复跑，请回原界面。</div>

}

function renderGraph(){

 const cut=R.defeat.checkId?`<text class="glabel" x="${(nodes[0]?.x+nodes[0]?.w+cx)/2||380}" y="${cy-6}">断 · ${esc(R.defeat.checkId)} · ${esc(R.defeat.kind)}</text>`:'';
 return `<div class="gridbg graphwrap"><div class="abs" style="min-height:${H}px">
  <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="max-width:100%">
   ${edges}
   ${nodes.map(n=>`<g data-gn="${esc(n.id)}" style="cursor:pointer"><rect class="gnode ${n.cut?'hit':''}" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="3"/><text class="gsmall" x="${n.x+10}" y="${n.y+16}">${esc(n.label)} · premise</text><text class="gtext" x="${n.x+10}" y="${n.y+35}">${esc(n.t.length>34?n.t.slice(0,34)+'…':n.t)}</text></g>`).join('')}
   <g data-gn="C" style="cursor:pointer"><rect class="gnode" x="${cx}" y="${cy}" width="240" height="56" rx="3"/><text class="gsmall" x="${cx+10}" y="${cy+16}">C · conclusion</text><text class="gtext" x="${cx+10}" y="${cy+37}">${esc(R.conclusion.text.length>26?R.conclusion.text.slice(0,26)+'…':R.conclusion.text)}</text></g>
   ${cut}
  </svg>
  <div style="font-family:var(--mono);font-size:10px;color:var(--muted);padding:4px 2px">${esc(R.lens.skeleton)} · 实线来自 supports 字段 · 断口来自 defeat.checkId，未连线的判定不画</div>

/* ─────────── 全库检索 ───────────
 * 只更新 #srResults，不重建整个主区：输入框若被重渲染，每打一个字都会丢焦点、
 * 光标跳回开头，检索就没法用了。响应带序号，慢的那次回来不能盖掉新结果。
 */
function fmtAt(ms){
 const d=new Date(Number(ms||0));
 if(!ms||isNaN(d.getTime())) return '—';
 return `${d.getMonth()+1}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
/* 先转义再插 <mark>：关键词来自输入框，绝不能当 HTML 拼进去。 */
function hl(text,q){
 const safe=esc(String(text??'')), needle=esc(q||''), lo=needle.toLowerCase(), lower=safe.toLowerCase();
 if(!needle) return safe;
 let out='',i=0;
 for(;;){
  const p=lower.indexOf(lo,i);
  if(p<0){ out+=safe.slice(i); break; }
  out+=safe.slice(i,p)+'<mark>'+safe.slice(p,p+needle.length)+'</mark>';
  i=p+needle.length;
 }
 return out;
}

function srResultsHtml(){
 const noHost=!wbHost()||!wbHost().search;
 const stale=S.sdirty?`<span class="cap">正在搜「${esc(S.sq)}」… 下列仍是「${esc(S.slastq||'上一次')}」的结果</span>`:'';
 const meta=S.sdone?`<div class="sr-meta"><span>命中 <b>${S.sdocTotal}</b> 份报告 / <b>${S.stotal}</b> 处</span><span>下列 <b>${S.shits.length}</b> 条</span>${stale}${S.scapped&&!S.sdirty?'<span class="cap">结果已限量（每份最多 3 条）；缩小关键词或加过滤可看更多</span>':''}${S.sbusy?'<span>检索中…</span>':''}</div>`:'';

function srReset(){
 ++S.sseq; S.sdone=false; S.shits=[]; S.stotal=0; S.sdocTotal=0; S.scapped=false; S.sbusy=false; S.serr=''; S.sdirty=false; S.slastq='';
 const b=$('srResults'); if(b) b.innerHTML=srResultsHtml();
 const e=$('srErr'); if(e) e.innerHTML='';
}
let srTimer=null;
async function runSearch(){
 const h=wbHost();
 if(!h||!h.search) return;
 const seq=++S.sseq;
 S.sbusy=true; S.sdirty=true;
 const box=$('srResults'); if(box) box.innerHTML=srResultsHtml();
 try{
  const r=await h.search(S.sq,{mode:S.sf.mode,theory:S.sf.theory,level:S.sf.level,limit:120});
  if(seq!==S.sseq) return;
  if(!r||!r.ok){ S.serr=(r&&r.error)||'检索通道没有返回结果'; S.shits=[]; S.stotal=0; S.sdocTotal=0; S.scapped=false; }
  else { S.serr=''; S.shits=r.hits||[]; S.stotal=r.total||0; S.sdocTotal=r.docTotal||0; S.scapped=!!r.capped; }
  S.sdone=true;
 }catch(e){
  if(seq!==S.sseq) return;
  S.serr=String(e); S.shits=[]; S.stotal=0; S.sdocTotal=0; S.scapped=false; S.sdone=true;
 }
 S.sbusy=false; S.sdirty=false; S.slastq=S.sq;
 const b=$('srResults'); if(b){ b.innerHTML=srResultsHtml(); bindSrRows(); }
 const er=$('srErr'); if(er) er.innerHTML=S.serr?`<div class="sr-err">${esc(S.serr)}</div>`:'';
}
function bindSearch(){
 const inp=$('srInput'); if(!inp) return;
 inp.addEventListener('input',e=>{
  S.sq=e.target.value; clearTimeout(srTimer);
  if(!S.sq.trim()){ srReset(); return; }
  /* 防抖的这 260ms 里，旧结果还在屏上。立刻把它标成「上一次的」，
     否则输入框写着新词、列表却高亮旧词，看起来像检索算错了。 */
  S.sdirty=true;
  const box=$('srResults'); if(box){ box.innerHTML=srResultsHtml(); bindSrRows(); }
  srTimer=setTimeout(runSearch,260);
 });
 inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); clearTimeout(srTimer); runSearch(); }
  else if(e.key==='Escape'){ e.preventDefault(); S.sq=''; inp.value=''; clearTimeout(srTimer); srReset(); }
 });
 $('srGo').addEventListener('click',()=>{ clearTimeout(srTimer); runSearch(); });
 /* 空状态里的示例词与「清空」走事件委托：这两块每次重绘都会换掉，
   逐个挂监听会随重绘次数越挂越多。 */
 const res=$('srResults');
 if(res&&!res.dataset.emptyBound){
  res.dataset.emptyBound='1';
  res.addEventListener('click',e=>{
   const b=e.target.closest && e.target.closest('[data-sq],[data-sqclear]');
   if(!b) return;
   if(b.dataset.sqclear){ clearTimeout(srTimer); S.sq=''; S.sf={mode:'all',theory:'all',level:'all'};
    const i2=$('srInput'); if(i2) i2.value='';
    ['srMode','srTheory','srLevel'].forEach(id=>{const n=$(id); if(n) n.value='all';});
    srReset(); if(i2) i2.focus(); return; }
   const q=b.dataset.sq;
   const i2=$('srInput'); if(i2) i2.value=q;
   S.sq=q; clearTimeout(srTimer); runSearch();
  });
 }
 $('srClear').addEventListener('click',()=>{ S.sq=''; inp.value=''; clearTimeout(srTimer); srReset(); inp.focus(); });
 [['srMode','mode'],['srTheory','theory'],['srLevel','level']].forEach(([id,k])=>{

 });
 bindSrRows();
 inp.focus();
}

 } else if(S.btab==='replay'){
  html=`<div class="qbar">本机存档实测 · 只读 userData/archive</div>`+
   [['存档总份数',ST.total],['不同原文段数',ST.passages],['最大一组复跑',ST.maxGroup],['checks 总条数',Object.values(ST.checks).reduce((a,b)=>a+b,0)],['未答 / 已答 / 违反',`${ST.checks.unanswered} / ${ST.checks.passed} / ${ST.checks.violated}`],['stage=argumentation',ST.stage.argumentation],['verdict=weakened',ST.levels.weakened]].map(([k,v])=>`<div class="row"><div class="k">${esc(k)}</div><div class="v mono">${esc(v)}</div></div>`).join('')+
   Object.entries(ST.modes).map(([k,v])=>`<div class="row"><div class="k">mode · ${esc(k)}</div><div class="v mono">${v}</div></div>`).join('');
 } else {
  html=S.log.length?S.log.map(l=>`<div class="logline"><span class="ts">${esc(l.t)}</span>${esc(l.m)}</div>`).join(''):'<div class="empty">暂无操作记录。点任意面板或按 Ctrl/⌘ + K 试试。</div>';
 }
 $('bottomBody').innerHTML=html;
 const body=$('bottomBody');
 const oi=$('objInput');
 if(oi){
  const add=()=>{const v=oi.value.trim(); if(!v)return; oi.value=''; addObjection(v);};
  $('objAdd').addEventListener('click',add);
  oi.addEventListener('keydown',e=>{if(e.key==='Enter')add();});
 }
 body.querySelectorAll('[data-drop]').forEach(b=>b.addEventListener('click',()=>dropObjection(S.objections[Number(b.dataset.drop)])));
 body.querySelectorAll('[data-locate]').forEach(b=>b.addEventListener('click',()=>locateObjection(S.objections[Number(b.dataset.locate)])));
 body.querySelectorAll('[data-anrow]').forEach(b=>b.addEventListener('click',()=>locateObjection(S.allObj[Number(b.dataset.anrow)])));
 if($('anField')) $('anField').addEventListener('click',()=>{S.anchor=null;renderBottom();toast('锚点改为跟随当前选中字段');});
 if($('anPick')) $('anPick').addEventListener('click',()=>{S.tab='source';renderTabs();renderMain();toast('点原文某句行尾的「钉在这句」');});
 if($('anNone')) $('anNone').addEventListener('click',()=>{S.anchor=false;renderBottom();toast('这条不锚定；同一份报告里只保留最新一条');});
 if($('anReload')) $('anReload').addEventListener('click',()=>loadAllObjections());
}

function renderStatus(){
 const p=R.passage||'', th=valInfo(R.theory), md=valInfo(R.mode);
 const lens=th?th.zh:esc(R.theory||'—'), act=md?md.zh:esc(R.mode||'—');
 /* 回看台同样不能把「少读了几份」说成「本机就这些」。样张没有 health 时
    什么都不显示——缺数据不等于体检通过，也不能反过来宣称无事。 */
 const h=D.health;
 const bad=h&&!h.dirError?(h.issues||[]).length:0,
       gone=h&&!h.dirError?(h.missing||[]).length:0,
       orph=h&&!h.dirError?(h.orphans||[]).length:0,
       idx=h&&(h.indexState==='invalid'||h.indexState==='rebuilt')?1:0;
 const n=bad+gone+orph+idx;
 const warn=h&&h.dirError?'存档目录读不出来':(n?`存档 ${n} 处对不上`:'');
 const warnTitle=h&&h.dirError?`目录：${h.dirError}。这时数目不可信，逐条结果在主程序「历史」里`
   :`读不出来的文件 ${bad} · 索引幽灵行 ${gone} · 磁盘孤儿 ${orph} · 索引异常 ${idx}。只读体检，没有删改任何文件；逐条结果在主程序「历史」里`;
 $('statusBar').innerHTML=`<span class="hi">● 就绪</span><span title="报告 id（本机存档用的编号）">${esc(R.id)}</span>
  <span title="报告原文写的是 ${esc(R.theory||'—')} / ${esc(R.mode||'—')}；中文只是标签翻译">透镜 ${esc(lens)} · ${esc(act)}</span>
  <span title="原文长度与切出的句数，按本地切句算">原文 ${p.length} 字 · ${sentences().length} 句</span>
  <span title="逐关检查里标为「未答」的条数 + 本机记下的异议条数">待答检查 / 异议 ${(R.checks||[]).filter(c=>c.answer==='unanswered').length+S.objections.length}</span>
  <span>我的异议 ${S.objections.length}${S.objLive?' · 已存盘':' · 未存盘'} · 已锚定 ${S.objections.filter(o=>deriveAnchor(o)).length}</span><span class="sp"></span>
  ${warn?`<button class="st-warn" data-archive-alert title="${esc(warnTitle)}">${esc(warn)} · 去主程序历史看</button>`:''}
  <span title="来自存档索引；左边资源管理器实际列出 ${(D.archive||[]).length} 条。数字不随这页的过滤变化">本机存档 ${ST.total} 份 · 这页索引 ${(D.archive||[]).length} 条${S.live?'（全量）':'（样张只带开头这些）'}</span>
  <span>${S.live?'报告只读 · 异议另存':'样张数据 · 未接模型'}</span>`;
 const al=$('statusBar').querySelector('[data-archive-alert]');
 if(al) al.addEventListener('click',()=>{
  const a=window.api&&window.api.archive;
  if(a&&a.reveal){ a.reveal(); toast('逐条文件名与原因在主程序「历史 → 存档体检」里；这里没有删改文件'); }
  else toast('这是样张，没有本机存档目录；逐条体检要开桌面应用');
 });
}

const COMMANDS=[...SECTIONS.map(s=>({t:`跳到 ${s.nm}`,p:`report.${s.id}`,run:()=>{S.tab='diagnose';S.activeSection=s.id;S.open[s.id]=true;renderTabs();renderMain();renderTree();setTimeout(()=>$('mainBody').querySelector(`[data-secbody="${s.id}"]`)?.scrollIntoView({block:'start'}),30);inspect(s.get(R),`report.${s.id}`);}})),
 ...TABS.map(t=>({t:`切换标签 ${t.nm}`,p:`view.${t.id}`,run:()=>{S.tab=t.id;renderTabs();renderMain();}})),
 {t:'切换深浅主题',p:'view.theme',run:()=>toggleTheme()},
 {t:'导出当前报告 JSON',p:'file.export',run:()=>doExport()},
 {t:'打开复跑账',p:'panel.replay',run:()=>{S.btab='replay';S.bottomOpen=true;$('bottomPane').classList.remove('collapsed');renderBottom();}},
];
/*
 * 字段搜索。命令面板原来只列命令，工具栏却写着「搜字段」——按下去找不到任何字段。
 * 这里把当前报告的每个叶子字段（路径 / 键名 / 值）做成可搜条目，文字逐字取自 R。
 * 空白查询只列命令，不把上千个字段糊人一脸；输入关键词才开始列字段。
 */
function jumpToField(f){
 const sec=SECTIONS.find(s=>s.id===f.sec);
 if(sec){
  S.tab='diagnose'; S.activeSection=sec.id; S.open[sec.id]=true;
  renderTabs();renderMain();renderTree();
  setTimeout(()=>{
   const n=$('mainBody').querySelector(`[data-secbody="${sec.id}"]`);
   if(n){ n.scrollIntoView({block:'start'}); n.classList.add('flash'); setTimeout(()=>n.classList.remove('flash'),1100); }
  },30);
 }
 const v=getPath(R,f.path);
 inspect(v===undefined?{path:f.path,value:f.val}:v,`字段 ${f.path}`);
}
function commandList(){
 const q=S.cmdQ.trim().toLowerCase();
 const cmds=COMMANDS.filter(c=>(c.t+c.p).toLowerCase().includes(q)).map(c=>({...c,kind:'命令'}));
 const fields=q?FIELD_INDEX.filter(f=>(f.path+' '+f.key+' '+f.val).toLowerCase().includes(q)).slice(0,8)
   .map(f=>({t:`${f.key} · ${clip(f.val,46)}`,p:f.path,kind:'字段',run:()=>jumpToField(f)})):[];
 return [...cmds,...fields].slice(0,12);
}
function renderCmd(){
 if(!S.cmdOpen){$('cmdLayer').innerHTML='';return;}
 const list=commandList();
 S.cmdIdx=Math.min(S.cmdIdx,Math.max(0,list.length-1));
 $('cmdLayer').innerHTML=`<div class="cmdwrap" id="cmdWrap"><div class="cmd">
  <input id="cmdInput" placeholder="输入命令或字段名…" value="${esc(S.cmdQ)}" autocomplete="off">
  <div class="cmdlist">${list.length?list.map((c,i)=>`<div class="cmdi ${i===S.cmdIdx?'on':''}" data-ci="${i}"><span class="t">${esc(c.t)}</span><span class="kind">${esc(c.kind)}</span><span class="p">${esc(c.p)}</span></div>`).join(''):'<div class="empty">没有匹配的命令或字段</div>'}</div>
  <div class="cmdf">↑↓ 选择 · Enter 执行 · Esc 关闭 · 共 ${list.length} 条${S.cmdQ.trim()?'（含字段）':' · 输入关键词才列字段'}</div></div></div>`;
 const inp=$('cmdInput'); inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);
 inp.addEventListener('input',e=>{S.cmdQ=e.target.value;S.cmdIdx=0;renderCmd();});
 inp.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();S.cmdIdx=Math.min(S.cmdIdx+1,list.length-1);renderCmd();}
  else if(e.key==='ArrowUp'){e.preventDefault();S.cmdIdx=Math.max(S.cmdIdx-1,0);renderCmd();}
  else if(e.key==='Enter'){e.preventDefault();runCmd(list[S.cmdIdx]);}
  else if(e.key==='Escape'){closeCmd();}
 });
 $('cmdLayer').querySelectorAll('[data-ci]').forEach(el=>el.addEventListener('click',()=>runCmd(list[Number(el.dataset.ci)])));
 $('cmdWrap').addEventListener('click',e=>{if(e.target.id==='cmdWrap')closeCmd();});
}
function runCmd(c){ if(!c)return; closeCmd(); c.run(); log(`命令 → ${c.p}`); renderStatus(); }
function closeCmd(){S.cmdOpen=false;S.cmdQ='';S.cmdIdx=0;renderCmd();}
function openCmd(){S.cmdOpen=true;S.cmdQ='';S.cmdIdx=0;renderCmd();}
function toggleTheme(){S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;log(`主题 → ${S.theme}`);}
function doExport(){
 const blob=new Blob([JSON.stringify(R,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${R.id}.json`;a.click();URL.revokeObjectURL(a.href);
 toast('已导出当前报告 JSON');log(`导出 → ${R.id}.json`);
}

$('themeBtn').addEventListener('click',toggleTheme);
$('cmdBtn').addEventListener('click',openCmd);
/*
 * 打开一份历史存档：向主进程要全文，成功后整套面板围绕新 R 重绘，
 * 并重算对照、重建字段索引、重新载入这一份自己的异议。
 * 样张模式（浏览器直接打开本文件）没有通道，明说打不开，不假装换了报告。
 */
async function openArchive(id){
 const seq=++S.arcSeq;
 /* 检索结果带过来的定位请求在函数入口就消费掉：打开失败、或这次点击已被
    后一次点击取代，都不留着，否则下一次随手点报告会莫名跳到某个字段。 */
 const jump=S.pendingJump; S.pendingJump=null;
 const sec=jump?SECTIONS.find(s=>s.id===jump.sec):null;
 const h=wbHost();
 if(!h || !h.report){
  toast('样张模式：内嵌样张只有索引，打不开其它存档');
  const a=(D.archive||[]).find(x=>x.id===id); if(a) inspect(a,`archive/${id}`);
  return;
 }
 toast('正在打开 '+id.slice(0,8)+' …');
 try{
  const r=await h.report(id);
  /* 连点两份：先发出去的旧请求可能后回来，采纳它就会把旧报告盖到新报告上。 */
  if(seq!==S.arcSeq) return;
  if(!r || !r.ok || !r.report){ toast((r&&r.error)||'这份存档打不开'); return; }
  R=r.report; C=r.compare||R;
  S.tab=sec?'diagnose':(jump&&jump.sec==='passage'?'source':'overview');
  S.sel=R.verdict; S.selLabel='report.verdict'; S.open={...DEFAULT_OPEN};
  S.activeSection=sec?sec.id:null;
  if(sec) S.open[sec.id]=true;
  S.log=[]; S.objections=[]; S.objLive=false; S.cmdOpen=false; S.cmdQ=''; S.anchor=null;
  $('cmdLayer').innerHTML='';
  buildFieldIndex(); syncMeta();
  renderTree();renderTabs();renderMain();renderInspector();renderBottom();renderStatus();
  log(`打开存档 ${R.id}（${R.theory}/${R.mode}）`);
  if(jump){
   setTimeout(()=>{
    /* 异议锚点可以钉在原文某句上；检索命中只落在字段上，两者分开走。 */
    if(jump.sentence){ S.tab='source'; renderTabs(); renderMain(); flashSentence(jump.sentence); return; }
    if(!jump.path) return;
    if(sec){
     const n=$('mainBody').querySelector(`[data-secbody="${sec.id}"]`);
     if(n){ n.scrollIntoView({block:'start'}); n.classList.add('flash'); setTimeout(()=>n.classList.remove('flash'),1100); }
    }
    const v=getPath(R,jump.path), key=String(jump.path).split('.').pop();
    inspect(v!==null&&typeof v==='object'?v:{[key]:v??'—'},`${jump.label?'异议锚点':'检索命中'} · ${jump.path}`);
   },30);
  }
  toast('已打开 '+R.id.slice(0,8)+' · '+R.mode);
  await loadObjections();
 }catch(e){ if(seq!==S.arcSeq) return; toast('打不开：'+String(e)); log('打开存档失败：'+String(e)); }
}
/* 异议按报告 id 存取；异步回来时若已切到另一份，别把旧异议贴到新报告上。 */
async function loadObjections(){
 const a=objApi(); const id=R.id;
 if(!a){ S.objections=[]; S.objLive=false; renderBottom(); renderStatus(); return; }
 try{
  const list=await a.of(id);
  if(R.id!==id) return;
  S.objections=objView(list); S.objLive=true;
  renderBottom(); renderStatus();
  if(S.tab==='source') renderMain();  // 原文里「已钉异议」的标记要跟着刷新
 }catch(e){
  if(R.id!==id) return;
  S.objections=[]; S.objLive=false; renderBottom(); renderStatus();
  toast('读不出本机异议：'+String(e));
 }
 loadAllObjections();
}
async function addObjection(reason){
 const a=objApi(); const id=R.id; const anchor=currentAnchor();
 if(!a){
  S.objections.push({key:'mem-'+Date.now(),diagId:id,reason,at:Date.now(),mem:true,anchor});
  log('样张模式：异议只留在本页，未写入本机'); renderBottom(); renderStatus();
  if(S.tab==='source') renderMain();
  toast('样张模式：只留在本页，没写进本机文件'); return;
 }
 const btn=$('objAdd'); if(btn) btn.disabled=true;
 try{
  /* refId 里也带上位置：万一主进程把锚点判成无效，这条也不会退回旧裸异议的
     key、把同报告里第一条异议悄悄覆盖掉。 */
  const r=await a.add({diagId:id,theory:R.theory,field:'anchor',
   refId:refIdOf(anchor),refLabel:anchor?anchor.label:'工作台 · 读者自记',
   excerpt:anchor?anchor.quote:String((R.verdict||{}).statement||'').slice(0,120),
   reason,...(anchor?{anchor}:{})});
  if(R.id!==id) return;
  if(!r || !r.ok){ toast('没记上：'+((r&&r.error)||'写入失败')); log('异议写入失败'); return; }
  S.objections=objView(r.list); S.objLive=true; S.anchor=null;
  renderBottom(); renderStatus(); if(S.tab==='source') renderMain();
  log(`异议已写入本机文件（${anchor?anchor.label:'未锚定'}，不改报告）`);
  toast(anchor?`已钉在「${anchor.label}」；判定文字未改`:'已写入本机异议文件；判定文字未改');
  loadAllObjections();
 }catch(e){ toast('没记上：'+String(e)); }
 finally{ const b=$('objAdd'); if(b) b.disabled=false; }
}
async function dropObjection(o){
 if(!o) return;
 const a=objApi();
 if(!a || o.mem){
  S.objections=S.objections.filter(x=>x.key!==o.key);
  renderBottom(); renderStatus(); log('撤销一条本页异议'); return;
 }
 const id=R.id;
 try{
  const r=await a.remove(id,o.key);
  if(R.id!==id) return;
  if(!r || !r.ok){ toast('没能撤销：'+((r&&r.error)||'删除失败')); return; }
  S.objections=objView(r.list); renderBottom(); renderStatus();
  if(S.tab==='source') renderMain();
  log('撤销一条本机异议'); loadAllObjections();
 }catch(e){ toast('没能撤销：'+String(e)); }
}
/* 工具栏入口：展开底部面板、切到异议地图，并当场重读一次本机文件。 */
$('anMapBtn').addEventListener('click',()=>{
 S.btab='anchors'; S.bottomOpen=true;
 $('bottomPane').classList.remove('collapsed'); $('bottomToggle').textContent='▾ 折叠';
 renderBottom(); loadAllObjections();
 log('工具栏 → 异议地图（只读本机 objections.jsonl）');
});
$('objReveal').addEventListener('click',()=>{
 const a=objApi();
 if(!a){ toast('样张模式：没有本机异议目录'); return; }
 a.reveal().then(p=>{toast('已打开：'+p);log('打开异议目录');}).catch(e=>toast('打不开：'+String(e)));
});
$('exportBtn').addEventListener('click',doExport);
$('bottomToggle').addEventListener('click',()=>{S.bottomOpen=!S.bottomOpen;$('bottomPane').classList.toggle('collapsed',!S.bottomOpen);$('bottomToggle').textContent=S.bottomOpen?'▾ 折叠':'▴ 展开';});
document.querySelectorAll('[data-log]').forEach(b=>b.addEventListener('click',()=>{log(b.dataset.log);toast(b.dataset.log);if(S.btab==='log')renderBottom();}));
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;renderTabs();renderMain();log(`工具栏 → ${S.tab}`);}));
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.cmdOpen?closeCmd():openCmd();}
 else if(e.key==='Escape'&&S.cmdOpen)closeCmd();
});

/*
 * 应用内运行时：主进程在 dom-ready 之后把本机真实存档注入进来，替换内嵌的样张数据。
 * 单独用浏览器打开这个文件时没有 window.api，按钮会明说是样张模式，不假装能用。
 * 注入只换数据源，界面里没有任何一行判定文字会被主进程改写。
 */
/* wbHost() 定义在脚本开头，与 openArchive / goBack / 刷新按钮共用同一处。 */
$('wbRefresh').addEventListener('click',()=>{ const h=wbHost(); if(h) h.refresh(); else toast('样张模式：没有本机存档通道'); });
function goBack(msg){
  const h=wbHost();
  if(h){ h.back(); if(msg) log(msg); }
  else toast('样张模式：没有主界面可切回（在应用里会回到原文输入框）');
}
$('wbBack').addEventListener('click',()=>goBack('← 回到原界面分析文本'));
/* 工具栏与速览页的按钮在重绘后仍然存在，用委托绑一次，不做半死不活的假按钮。 */
document.addEventListener('click',e=>{
  const a=e.target.closest&&e.target.closest('[data-act]');
  if(a){
    const k=a.dataset.act;
    if(k==='back'){ goBack('速览 → 回到原界面分析文本'); return; }
    S.tab=k; renderTabs(); renderMain(); log(`速览 → ${k}`);
    return;
  }
  const b=e.target.closest&&e.target.closest('[data-back]');
  if(b){ goBack(b.dataset.back.trim()); return; }
  if(e.target.closest&&e.target.closest('#ovQuote')){ S.tab='source'; renderTabs(); renderMain(); }
});
/* 引导条只第一次出现，之后别一直占一行。 */
$('guideClose').addEventListener('click',()=>{
  $('guideBar').style.display='none';
  try{ localStorage.setItem('wbGuideV2','1'); }catch(_){}
});
try{ if(localStorage.getItem('wbGuideV2')==='1') $('guideBar').style.display='none'; }catch(_){}
window.__wbApply = (d)=>{
  if(!d || !d.report) return;
  D=d; D.archive=Array.isArray(D.archive)?D.archive:[]; D.pairOf=d.pairOf||{};
  R=d.report; C=d.compare||d.report; ST=d.stats||ST;
  S.live=true; S.tab='overview'; S.sel=R.verdict; S.selLabel='report.verdict';
  S.open={...DEFAULT_OPEN}; S.objections=[]; S.objLive=false; S.log=[]; S.arcQ=''; S.activeSection=null; S.anchor=null;
  S.arcSeq++; // 主进程重新注入了整份数据：在途的「打开存档」请求一律作废
  buildFieldIndex(); syncMeta();
  renderTree();renderTabs();renderMain();renderInspector();renderBottom();renderStatus();
  const e=$('wbSource'); if(e) e.textContent='v2 · 本机存档';
  log(`载入本机存档 ${R.id}（索引 ${D.archive.length} 条）`);
  loadObjections();
};

log(`载入真实报告 ${R.id}`);
S.sel=R.verdict;S.selLabel='report.verdict';
buildFieldIndex(); syncMeta();
renderTree();renderTabs();renderMain();renderInspector();renderBottom();renderStatus();
loadObjections();
</script>
